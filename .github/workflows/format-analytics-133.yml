name: Format analytics 133

on:
  push:
    branches:
      - format/analytics-vitals-133

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            e2e/analytics.spec.ts \
            src/__tests__/vitals.test.tsx \
            src/components/Footer.tsx \
            src/hooks/useVitals.ts \
            src/pages/Careers.tsx \
            src/pages/Privacy.tsx \
            src/pages/Security.tsx \
            src/pages/Stellar.tsx \
            src/pages/Vitals.tsx \
            src/utils/track.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/analytics.spec.ts src/__tests__/vitals.test.tsx src/components/Footer.tsx src/hooks/useVitals.ts src/pages/Careers.tsx src/pages/Privacy.tsx src/pages/Security.tsx src/pages/Stellar.tsx src/pages/Vitals.tsx src/utils/track.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(analytics): format issue 133 changes [skip ci]"
            git push
          fi
