name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:lighthouse
      - run: pnpm build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Start preview server
        run: |
          mkdir -p lighthouse-reports
          pnpm preview --host 127.0.0.1 > /tmp/wraith-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wraith-preview.log
          exit 1
      - name: Lighthouse mobile
        id: lighthouse_mobile
        continue-on-error: true
        run: >-
          pnpm exec lighthouse http://127.0.0.1:4173/
          --only-categories=performance,accessibility,best-practices,seo
          --output=json --output-path=lighthouse-reports/mobile.json
          --chrome-path="${{ steps.chrome.outputs.chrome-path }}"
          --chrome-flags="--headless --no-sandbox"
      - name: Lighthouse desktop
        id: lighthouse_desktop
        continue-on-error: true
        run: >-
          pnpm exec lighthouse http://127.0.0.1:4173/
          --preset=desktop
          --only-categories=performance,accessibility,best-practices,seo
          --output=json --output-path=lighthouse-reports/desktop.json
          --chrome-path="${{ steps.chrome.outputs.chrome-path }}"
          --chrome-flags="--headless --no-sandbox"
      - name: Evaluate Lighthouse budgets
        if: always()
        env:
          MOBILE_OUTCOME: ${{ steps.lighthouse_mobile.outcome }}
          DESKTOP_OUTCOME: ${{ steps.lighthouse_desktop.outcome }}
        run: node scripts/lighthouse-budget.mjs summarize
      - name: Comment on Lighthouse results
        id: lighthouse_comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const results = JSON.parse(fs.readFileSync('lighthouse-budget-results.json', 'utf8'));
            const marker = '<!-- wraith-lighthouse-budget -->';
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const reasonMatch = context.payload.pull_request.body?.match(/^Lighthouse budget override:\s*(.+)$/im);
            const reason = reasonMatch?.[1]?.trim() ?? '';
            const overrideAuthorized = labels.includes('lighthouse-budget-override') && reason.length > 0;
            core.setOutput('override-authorized', String(overrideAuthorized));

            const lines = [marker, '## Lighthouse budget'];
            if (results.budgetFailures.length === 0 && results.auditFailures.length === 0) {
              lines.push('All required categories met the 95-point budget in mobile and desktop audits.');
            } else {
              for (const failure of results.budgetFailures) {
                const score = failure.score === null ? 'missing' : `${Math.round(failure.score * 100)}/95`;
                lines.push(`- \`${failure.route}\` (${failure.profile}): ${failure.category} ${score}`);
              }
              for (const failure of results.auditFailures) {
                lines.push(`- Lighthouse ${failure.profile} audit error: ${failure.message}`);
              }
            }
            if (overrideAuthorized && results.budgetFailures.length > 0) {
              lines.push('', `Override applied: ${reason}`);
            } else if (results.budgetFailures.length > 0 && labels.includes('lighthouse-budget-override')) {
              lines.push('', 'The override label is present, but a non-empty `Lighthouse budget override: <reason>` line is also required in the PR description.');
            }
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Enforce Lighthouse budgets
        if: always()
        env:
          LIGHTHOUSE_OVERRIDE_AUTHORIZED: ${{ steps.lighthouse_comment.outputs.override-authorized }}
        run: node scripts/lighthouse-budget.mjs enforce
      - run: pnpm lint:i18n
      - run: pnpm test:a11y
      - run: pnpm build
      - run: pnpm validate:jsonld

      - name: Ensure Playwright reports are not tracked
        run: |
          if git ls-files --error-unmatch 'playwright-report/**' >/dev/null 2>&1; then
            echo "::error::Generated Playwright reports must not be committed."
            exit 1
          fi

  serverless-smoke:
    name: Serverless Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke test the serverless routes
        run: pnpm test:smoke

  playwright-a11y:
    name: Playwright A11y Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright a11y tests
        run: pnpm test:a11y:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run Lighthouse on Mobile
        id: lighthouse_mobile
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          startServerCommand: pnpm preview
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Save Mobile Manifest
        if: steps.lighthouse_mobile.outcome == 'success'
        run: cp -r .lighthouseci .lighthouseci-mobile

      - name: Run Lighthouse on Desktop
        id: lighthouse_desktop
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          startServerCommand: pnpm preview
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.github/lhci-desktop.json'

      - name: Save Desktop Manifest
        if: steps.lighthouse_desktop.outcome == 'success'
        run: cp -r .lighthouseci .lighthouseci-desktop

      - name: Post Comment on PR
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          steps.lighthouse_mobile.outcome == 'success' &&
          steps.lighthouse_desktop.outcome == 'success'
        env:
          MOBILE_LINKS: ${{ steps.lighthouse_mobile.outputs.links }}
          DESKTOP_LINKS: ${{ steps.lighthouse_desktop.outputs.links }}
        with:
          script: |
            const fs = require('fs');
            const mobileManifest = JSON.parse(fs.readFileSync('.lighthouseci-mobile/manifest.json', 'utf8'));
            const desktopManifest = JSON.parse(fs.readFileSync('.lighthouseci-desktop/manifest.json', 'utf8'));

            const mobile = mobileManifest[0];
            const desktop = desktopManifest[0];

            const formatScore = (val) => Math.round(val * 100);

            const mobilePerf = formatScore(mobile.summary.performance);
            const mobileA11y = formatScore(mobile.summary.accessibility);
            const mobileBp = formatScore(mobile.summary['best-practices']);
            const mobileSeo = formatScore(mobile.summary.seo);

            const desktopPerf = formatScore(desktop.summary.performance);
            const desktopA11y = formatScore(desktop.summary.accessibility);
            const desktopBp = formatScore(desktop.summary['best-practices']);
            const desktopSeo = formatScore(desktop.summary.seo);

            const getScoreEmoji = (score) => {
              if (score >= 95) return '🟢';
              if (score >= 90) return '🟡';
              return '🔴';
            };

            const mobileLinks = JSON.parse(process.env.MOBILE_LINKS || '{}');
            const desktopLinks = JSON.parse(process.env.DESKTOP_LINKS || '{}');
            const mobileReport = mobileLinks['http://localhost:4173/'] || '';
            const desktopReport = desktopLinks['http://localhost:4173/'] || '';

            const reportLinks = [];
            if (mobileReport) reportLinks.push(`[Mobile Report](${mobileReport})`);
            if (desktopReport) reportLinks.push(`[Desktop Report](${desktopReport})`);
            const reportText = reportLinks.length > 0 ? `📄 **Reports:** ${reportLinks.join(' | ')}` : '';

            const body = `### ⚡ Lighthouse Audit Results

            | Category | Mobile | Desktop | Target |
            | --- | --- | --- | --- |
            | **Performance** | ${getScoreEmoji(mobilePerf)} **${mobilePerf}** | ${getScoreEmoji(desktopPerf)} **${desktopPerf}** | >= 95 |
            | **Accessibility** | ${getScoreEmoji(mobileA11y)} **${mobileA11y}** | ${getScoreEmoji(desktopA11y)} **${desktopA11y}** | >= 95 |
            | **Best Practices** | ${getScoreEmoji(mobileBp)} **${mobileBp}** | ${getScoreEmoji(desktopBp)} **${desktopBp}** | >= 95 |
            | **SEO** | ${getScoreEmoji(mobileSeo)} **${mobileSeo}** | ${getScoreEmoji(desktopSeo)} **${desktopSeo}** | >= 95 |

            ${reportText}

            *Audit ran against the latest build on preview server.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
